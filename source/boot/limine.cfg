${WING_KERNEL}=boot:///wing_kernel.elf

TIMEOUT=3
DEFAULT_ENTRY=2

GRAPHICS=yes

WALLPAPER=boot:///frostwing_bg.png
WALLPAPER_STYLE=stretched
BACKDROP_COLOR=282a36

INTERFACE_BRANDING=FrostWing
INTERFACE_BRANDING_COLOR=4

# black;red;green;yellow;blue;magenta;cyan;white
TERM_PALETTE=282a36;ff5555;50fa7b;f1fa8c;bd93f9;ff79c6;8be9fd;f8f8f2
TERM_PALETTE_BRIGHT=6272a4;ff6e6e;69ff94;ffffa5;d6acff;ff92df;a4ffff;ffffff
TERM_BACKGROUND=c0282a36
TERM_FOREGROUND=f8f8f2

TERM_MARGIN=64
TERM_MARGIN_GRADIENT=32

TERM_FONT=boot:///iso.f16

# Folder (the + makes it expanded by default)
:+FrostWing

::Normal
    COMMENT=Randomized kernel base (KASLR on). Arch: ${ARCH}
    PROTOCOL=limine
    KERNEL_PATH=${WING_KERNEL}
    CMDLINE=rootdisk=disk1p1 bootdisk=disk0p1
    MODULE_PATH=boot:///font.sfn

::KASLR off
    COMMENT=Fixed kernel base address, easier for debugging. Arch: ${ARCH}
    PROTOCOL=limine
    KASLR=no
    KERNEL_PATH=${WING_KERNEL}
    CMDLINE=rootdisk=disk1p1 bootdisk=disk0p1
    MODULE_PATH=boot:///font.sfn

::No rootdisk/bootdisk
    COMMENT=Boots without rootdisk/bootdisk arguments. Arch: ${ARCH}
    PROTOCOL=limine
    KERNEL_PATH=${WING_KERNEL}
    MODULE_PATH=boot:///font.sfn

::Safe video (1024x768)
    COMMENT=Forces a low resolution framebuffer. Arch: ${ARCH}
    PROTOCOL=limine
    RESOLUTION=1024x768x32
    KERNEL_PATH=${WING_KERNEL}
    CMDLINE=rootdisk=disk1p1 bootdisk=disk0p1
    MODULE_PATH=boot:///font.sfn